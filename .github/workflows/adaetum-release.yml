name: Release Adaetum agent software

# A release is an explicit operator decision; ordinary commits never update
# clusters. The manifest records immutable image and binary hashes.
#
# To release: open this workflow, choose the branch to build under "Use workflow
# from", and give the tag. The release is built from the tip of that branch as it
# is when you press Run. A tag containing -beta. (adaetum-v1.2.3-beta.1) is a beta
# release: marked pre-release and never "latest". Any other tag (adaetum-v1.2.3)
# is a stable release.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'New tag, e.g. adaetum-v0.1.2-beta.1 (beta) or adaetum-v0.1.2 (stable)'
        required: true
        type: string

permissions:
  contents: write
  packages: write

concurrency:
  # One release per tag at a time, whichever branch it is built from.
  group: adaetum-release-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  # Fast fail: everything that can be known from the request alone is checked first,
  # in seconds, so a mistyped or already-used tag never waits for the test suite or
  # the image builds. No checkout and no build tools are needed.
  validate:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.check.outputs.tag }}
      version: ${{ steps.check.outputs.version }}
      channel: ${{ steps.check.outputs.channel }}
    steps:
      - name: Validate the branch and the release tag
        id: check
        shell: bash
        env:
          REQUESTED_TAG: ${{ inputs.release_tag }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The branch is the one chosen under "Use workflow from". A tag or a pull request
          # ref is not a branch, so there is nothing sensible to build and release.
          if [[ "$REF_TYPE" != branch ]]; then
            echo "Run this workflow from a branch ('Use workflow from'), not from ${REF_TYPE} ${REF_NAME}." >&2
            exit 1
          fi
          tag="$REQUESTED_TAG"
          if [[ ! "$tag" =~ ^adaetum-v((0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-beta\.(0|[1-9][0-9]*))?)$ ]]; then
            echo "Expected a tag like adaetum-v1.2.3 (stable) or adaetum-v1.2.3-beta.1 (beta); got '${tag}'." >&2
            if [[ "${tag,,}" == *beta* ]]; then
              echo "A beta tag must end in -beta.N, with N a number, for example adaetum-v1.2.3-beta.1." >&2
            fi
            exit 1
          fi
          version="${BASH_REMATCH[1]}"
          channel=stable
          if [[ "$version" == *-beta.* ]]; then channel=beta; fi
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" --silent 2>/dev/null; then
            echo "The tag ${tag} already exists; choose a new version." >&2
            exit 1
          fi
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "A release for ${tag} already exists; choose a new version." >&2
            exit 1
          fi
          echo "Releasing branch ${REF_NAME} as ${tag} (${channel})."
          {
            echo "tag=${tag}"
            echo "version=${version}"
            echo "channel=${channel}"
          } >> "$GITHUB_OUTPUT"

  # The same suite pull requests run; a release cannot test less than a PR did.
  tests:
    needs: validate
    uses: ./.github/workflows/adaetum-tests.yml

  release:
    needs: [validate, tests]
    runs-on: ubuntu-latest
    env:
      ADAETUM_RELEASE_TAG: ${{ needs.validate.outputs.tag }}
      ADAETUM_VERSION: ${{ needs.validate.outputs.version }}
      ADAETUM_CHANNEL: ${{ needs.validate.outputs.channel }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.3'
      - uses: actions/setup-node@v6
        with:
          node-version: '24.11.1'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Name the image registry
        shell: bash
        run: echo "ADAETUM_REGISTRY=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - name: Build the host binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          (cd adaetum/agent/web && npm ci && npm run build)
          for arch in amd64 arm64; do
            (cd adaetum/agent && CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath \
              -ldflags="-s -w -X main.agentVersion=${ADAETUM_VERSION}" \
              -o "${GITHUB_WORKSPACE}/release/adaetum-agent-linux-${arch}" ./cmd/adaetum-agent)
          done
          (cd adaetum/auth && bun build --compile --target=bun-linux-x64 src/server.ts --outfile "${GITHUB_WORKSPACE}/release/adaetum-auth-linux-amd64")
          (cd adaetum/auth && bun build --compile --target=bun-linux-arm64 src/server.ts --outfile "${GITHUB_WORKSPACE}/release/adaetum-auth-linux-arm64")
          (cd release && sha256sum adaetum-* > SHA256SUMS)
      - name: Build and publish pinned images
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          for component in agent auth embed; do
            image="${ADAETUM_REGISTRY}/adaetum-${component}:${ADAETUM_RELEASE_TAG}"
            if [ "$component" = agent ]; then
              docker build --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" --build-arg "ADAETUM_VERSION=${ADAETUM_VERSION}" -t "$image" "adaetum/$component"
            else
              docker build --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" -t "$image" "adaetum/$component"
            fi
            case "$component" in
              agent)
                test "$(docker run --rm "$image" version)" = "$ADAETUM_VERSION"
                ;;
              auth)
                docker run --rm --entrypoint bun "$image" --version
                ;;
              embed)
                # Exercise the real model before publishing the image, not the
                # hash-only test implementation. The port is runner-local.
                docker run -d --name adaetum-embed-smoke -p 127.0.0.1:18700:8080 "$image"
                trap 'docker rm -f adaetum-embed-smoke >/dev/null 2>&1 || true' EXIT
                ready=0
                for attempt in {1..30}; do
                  if curl -fsS http://127.0.0.1:18700/readyz >/dev/null; then ready=1; break; fi
                  sleep 2
                done
                if [ "$ready" != 1 ]; then docker logs adaetum-embed-smoke; exit 1; fi
                curl -fsS -H 'Content-Type: application/json' -d '{"texts":["Adaetum"]}' \
                  http://127.0.0.1:18700/embed | python3 -c 'import json,sys; r=json.load(sys.stdin); assert r["dim"] == 384 and len(r["vectors"]) == 1'
                docker rm -f adaetum-embed-smoke >/dev/null
                trap - EXIT
                ;;
            esac
            docker push "$image"
            digest="$(docker buildx imagetools inspect "$image" --format '{{json .Manifest.Digest}}' | tr -d '"')"
            if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "Could not determine the published digest for $image" >&2
              exit 1
            fi
            printf '%s\n' "${ADAETUM_REGISTRY}/adaetum-${component}@${digest}" > "release/${component}.image"
          done
      - name: Publish release and immutable artifact manifest
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 adaetum/release-manifest.py release
          release_flags=()
          if [[ "$ADAETUM_CHANNEL" == beta ]]; then release_flags+=(--prerelease --latest=false); fi
          gh release create "$ADAETUM_RELEASE_TAG" release/adaetum-* release/SHA256SUMS release/release.json "${release_flags[@]}" \
            --target "$GITHUB_SHA" \
            --title "Adaetum agent ${ADAETUM_VERSION}" \
            --notes "Versioned agent, auth, and embedding artifacts. See release.json for image digests and host binary checksums. Updating a cluster or host remains an operator decision. Built from branch ${GITHUB_REF_NAME} at commit ${GITHUB_SHA}."
