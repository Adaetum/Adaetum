apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - networkpolicy.yaml
# Point this at the image you built and pushed, ideally by digest:
#   kustomize edit set image adaetum-embed=registry.example/adaetum-embed@sha256:...
images:
  - name: adaetum-embed
    newName: adaetum-embed
    newTag: 0.1.0
