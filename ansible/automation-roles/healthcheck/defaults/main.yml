---
# Default variables for healthcheck
healthcheck_report_path: "/var/log/ansible-healthcheck.txt"
healthcheck_check_services:
  - sshd
  - chronyd
  - tailscaled
  - rke2-server
healthcheck_disk_min_free_gb: 2
healthcheck_write_report: true
healthcheck_log_services:
  - rke2-server
  - tailscaled
  - sshd
healthcheck_log_lines: 200
healthcheck_log_error_patterns:
  - "error"
  - "failed"
  - "panic"
  - "fatal"
healthcheck_dns_name: "tailscale.com"
healthcheck_ping_target: "1.1.1.1"
healthcheck_cpu_load_max_per_core: 1.5
healthcheck_check_kube_api: true
healthcheck_check_observability: true
# Prometheus discovers newly reconciled monitor resources asynchronously. Keep
# the healthcheck strict, but allow the controllers a bounded convergence
# window before declaring the GitOps handoff unhealthy.
healthcheck_observability_target_retries: 30
healthcheck_observability_target_delay: 10
# These names are the stable handoff between workload-owned metrics and both
# Adaetum and Rancher Prometheus discovery. The live healthcheck verifies the
# resources and active scrape pools after GitOps reconciliation.
healthcheck_required_monitor_names:
  - alertmanager
  - argocd-application-controller
  - argocd-applicationset-controller
  - argocd-notifications-controller
  - argocd-repo-server
  - argocd-server
  - authentik-server
  - authentik-worker
  - cloudflared
  - external-dns
  - external-secrets-cert-controller-metrics
  - external-secrets-metrics
  - external-secrets-webhook-metrics
  - gitea
  - grafana
  - kube-vip
  - kured
  - prometheus-exporter
  - reloader-reloader
