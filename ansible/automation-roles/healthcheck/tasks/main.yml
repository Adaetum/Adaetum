---
# Read-only host and cluster health evidence used by bootstrap diagnostics and
# scheduled checks. Threshold failures are intentional signals for operators;
# this role must not repair or mutate a node while measuring it.
- name: Verify basic connectivity
  ansible.builtin.ping:

- name: Collect service facts
  ansible.builtin.service_facts:

- name: Get CPU core count
  ansible.builtin.command: nproc
  register: health_cpu_cores
  changed_when: false

- name: Check hostname
  ansible.builtin.command: hostname
  register: health_hostname
  changed_when: false

- name: Check uptime
  ansible.builtin.command: uptime -p
  register: health_uptime
  changed_when: false

- name: Check load averages
  ansible.builtin.command: uptime
  register: health_load
  changed_when: false

- name: Read 1-minute load from /proc/loadavg
  ansible.builtin.command: awk '{print $1}' /proc/loadavg
  register: health_load_1m_raw
  changed_when: false
  failed_when: false

- name: Parse 1-minute load
  ansible.builtin.set_fact:
    health_load_1m: "{{ (health_load_1m_raw.stdout | default('0') | trim | float) }}"
  when: health_load_1m_raw is defined

- name: Parse CPU core count
  ansible.builtin.set_fact:
    health_cpu_cores_count: "{{ (health_cpu_cores.stdout | default('1') | trim | int) }}"
  when: health_cpu_cores.stdout is defined

- name: Fail if load is above threshold per core
  ansible.builtin.fail:
    msg: "Load average {{ health_load_1m }} exceeds {{ healthcheck_cpu_load_max_per_core }} per core"
  when:
    - health_load_1m is defined
    - health_cpu_cores_count is defined
    - (health_cpu_cores_count | int) > 0
    - ((health_load_1m | float) / (health_cpu_cores_count | int)) > (healthcheck_cpu_load_max_per_core | float)

- name: Check disk usage
  ansible.builtin.command: "{{ healthcheck_df_cmd }}"
  register: health_disk
  changed_when: false

- name: Check inode usage
  ansible.builtin.command: df -Pi /
  register: health_inodes
  changed_when: false

- name: Parse disk free GB
  ansible.builtin.set_fact:
    health_disk_free_gb: "{{ (health_disk.stdout_lines[1].split()[3] | int) // 1024 }}"
  when: health_disk.stdout_lines | length > 1

- name: Fail if disk free is below threshold
  ansible.builtin.fail:
    msg: "Free disk space below {{ healthcheck_disk_min_free_gb }}GB (found {{ health_disk_free_gb }}GB)"
  when:
    - health_disk_free_gb is defined
    - (health_disk_free_gb | int) < (healthcheck_disk_min_free_gb | int)

- name: Check memory usage
  ansible.builtin.command: free -h
  register: health_memory
  changed_when: false

- name: Check time sync status
  ansible.builtin.command: timedatectl show -p NTPSynchronized --value
  register: health_time_sync
  changed_when: false
  failed_when: false

- name: Check DNS resolution
  ansible.builtin.command: getent hosts "{{ healthcheck_dns_name }}"
  register: health_dns
  changed_when: false
  failed_when: false

- name: Check outbound ping
  ansible.builtin.command: ping -c 1 "{{ healthcheck_ping_target }}"
  register: health_ping
  changed_when: false
  failed_when: false

- name: Check Tailscale status
  ansible.builtin.command: tailscale status --self
  register: health_tailscale
  changed_when: false
  failed_when: false

- name: Detect kubectl for read-only cluster health checks
  ansible.builtin.shell: |
    set -o pipefail
    if command -v kubectl >/dev/null 2>&1; then
      command -v kubectl
    elif [ -x /var/lib/rancher/rke2/bin/kubectl ]; then
      printf '%s\n' /var/lib/rancher/rke2/bin/kubectl
    fi
  args:
    executable: /bin/bash
  register: health_kubectl_detect
  changed_when: false
  failed_when: false
  when: kubectl_cmd is not defined or (kubectl_cmd | string | length == 0)

- name: Resolve kubectl for read-only cluster health checks
  ansible.builtin.set_fact:
    healthcheck_kubectl_cmd: >-
      {{
        kubectl_cmd
        | default(health_kubectl_detect.stdout | default('') | trim, true)
      }}

- name: Check kube API health
  ansible.builtin.command: "{{ healthcheck_kubectl_cmd }} get --raw=/healthz"
  register: health_kube
  changed_when: false
  failed_when: false
  when:
    - healthcheck_check_kube_api | bool
    - healthcheck_kubectl_cmd | length > 0

- name: Collect Rancher-compatible monitor resources
  ansible.builtin.command: >-
    {{ healthcheck_kubectl_cmd }} get servicemonitors,podmonitors
    --all-namespaces
    --selector=release=rancher-monitoring
    --output=json
  register: health_monitor_resources
  changed_when: false
  when:
    - healthcheck_check_observability | bool
    - healthcheck_kubectl_cmd | length > 0

- name: Verify every required workload monitor exists
  ansible.builtin.assert:
    that:
      - >-
        healthcheck_required_monitor_names
        | difference(
            (health_monitor_resources.stdout | from_json)['items']
            | map(attribute='metadata.name')
            | list
          )
        | length == 0
    fail_msg: >-
      Required Rancher-compatible ServiceMonitor or PodMonitor resources are
      missing after GitOps reconciliation.
    quiet: true
  when:
    - healthcheck_check_observability | bool
    - health_monitor_resources is defined
    - (health_monitor_resources.rc | default(1)) == 0

- name: Query Adaetum Prometheus active scrape targets
  ansible.builtin.command:
    argv:
      - "{{ healthcheck_kubectl_cmd }}"
      - get
      - >-
        --raw=/api/v1/namespaces/observability/services/http:prometheus-operated:9090/proxy/api/v1/targets?state=active
  register: health_adaetum_prometheus_targets
  changed_when: false
  until: >-
    health_adaetum_prometheus_targets.rc == 0
    and
    healthcheck_required_monitor_names
    | difference(
        ((health_adaetum_prometheus_targets.stdout | from_json)['data']['activeTargets'])
        | map(attribute='scrapePool')
        | map('regex_replace', '/[0-9]+$', '')
        | map('regex_replace', '^.*/', '')
        | list
      )
    | length == 0
    and
    ((health_adaetum_prometheus_targets.stdout | from_json)['data']['activeTargets'])
    | selectattr('health', 'equalto', 'down')
    | map(attribute='scrapePool')
    | select('search', '/(' + (healthcheck_required_monitor_names | join('|')) + ')/')
    | list
    | length == 0
  retries: "{{ healthcheck_observability_target_retries | int }}"
  delay: "{{ healthcheck_observability_target_delay | int }}"
  when:
    - healthcheck_check_observability | bool
    - healthcheck_kubectl_cmd | length > 0

- name: Verify Adaetum Prometheus discovered every required monitor
  ansible.builtin.assert:
    that:
      - >-
        healthcheck_required_monitor_names
        | difference(
            (health_adaetum_prometheus_targets.stdout | from_json)['data']['activeTargets']
            | map(attribute='scrapePool')
            | map('regex_replace', '/[0-9]+$', '')
            | map('regex_replace', '^.*/', '')
            | list
          )
        | length == 0
      - >-
        (health_adaetum_prometheus_targets.stdout | from_json)['data']['activeTargets']
        | selectattr('health', 'equalto', 'down')
        | map(attribute='scrapePool')
        | select('search', '/(' + (healthcheck_required_monitor_names | join('|')) + ')/')
        | list
        | length == 0
    fail_msg: >-
      Adaetum Prometheus is missing a required scrape pool or reports a required
      workload metrics target as down.
    quiet: true
  when:
    - healthcheck_check_observability | bool
    - health_adaetum_prometheus_targets is defined
    - (health_adaetum_prometheus_targets.rc | default(1)) == 0

- name: Detect Rancher Monitoring Prometheus
  ansible.builtin.command: >-
    {{ healthcheck_kubectl_cmd }} --namespace cattle-monitoring-system
    get service rancher-monitoring-prometheus --output=name
  register: health_rancher_prometheus_service
  changed_when: false
  failed_when: false
  when:
    - healthcheck_check_observability | bool
    - healthcheck_kubectl_cmd | length > 0

- name: Query Rancher Prometheus active scrape targets
  ansible.builtin.command:
    argv:
      - "{{ healthcheck_kubectl_cmd }}"
      - get
      - >-
        --raw=/api/v1/namespaces/cattle-monitoring-system/services/http:rancher-monitoring-prometheus:9090/proxy/api/v1/targets?state=active
  register: health_rancher_prometheus_targets
  changed_when: false
  until: >-
    health_rancher_prometheus_targets.rc == 0
    and
    healthcheck_required_monitor_names
    | difference(
        ((health_rancher_prometheus_targets.stdout | from_json)['data']['activeTargets'])
        | map(attribute='scrapePool')
        | map('regex_replace', '/[0-9]+$', '')
        | map('regex_replace', '^.*/', '')
        | list
      )
    | length == 0
  retries: "{{ healthcheck_observability_target_retries | int }}"
  delay: "{{ healthcheck_observability_target_delay | int }}"
  when:
    - healthcheck_check_observability | bool
    - health_rancher_prometheus_service is defined
    - (health_rancher_prometheus_service.rc | default(1)) == 0

- name: Verify Rancher Prometheus discovered every required monitor
  ansible.builtin.assert:
    that:
      - >-
        healthcheck_required_monitor_names
        | difference(
            (health_rancher_prometheus_targets.stdout | from_json)['data']['activeTargets']
            | map(attribute='scrapePool')
            | map('regex_replace', '/[0-9]+$', '')
            | map('regex_replace', '^.*/', '')
            | list
          )
        | length == 0
    fail_msg: >-
      Rancher Monitoring is installed but its Prometheus instance has not
      discovered every Adaetum ServiceMonitor and PodMonitor.
    quiet: true
  when:
    - healthcheck_check_observability | bool
    - health_rancher_prometheus_targets is defined
    - (health_rancher_prometheus_targets.rc | default(1)) == 0

- name: Collect service logs
  ansible.builtin.command: "journalctl -u {{ item }} -n {{ healthcheck_log_lines }} --no-pager"
  register: health_logs
  changed_when: false
  failed_when: false
  loop: "{{ healthcheck_log_services }}"
  when: healthcheck_log_services | length > 0

- name: Scan logs for error patterns
  ansible.builtin.set_fact:
    health_log_matches: >-
      {{
        (health_log_matches | default({}))
        | combine({
            item.item: (item.stdout_lines | default([]) | select('search', healthcheck_log_error_patterns | join('|')) | list)
          })
      }}
  loop: "{{ health_logs.results | default([]) }}"
  when: healthcheck_log_error_patterns | length > 0

- name: Check required services
  ansible.builtin.assert:
    that:
      - "(item in ansible_facts.services) or ((item + '.service') in ansible_facts.services)"
      - >-
        (
          (ansible_facts.services[item].state)
          if (item in ansible_facts.services)
          else (ansible_facts.services[item + '.service'].state)
        ) == 'running'
    fail_msg: "Service {{ item }} is not running"
    quiet: true
  loop: "{{ healthcheck_check_services }}"
  when: healthcheck_check_services | length > 0

- name: Report health summary
  ansible.builtin.debug:
    msg:
      - "hostname: {{ health_hostname.stdout }}"
      - "uptime: {{ health_uptime.stdout }}"
      - "load: {{ health_load.stdout | default('n/a') }}"
      - "cpu_cores: {{ health_cpu_cores.stdout | default('n/a') }}"
      - "disk: {{ health_disk.stdout_lines | default([]) }}"
      - "inodes: {{ health_inodes.stdout_lines | default([]) }}"
      - "disk_free_gb: {{ health_disk_free_gb | default('n/a') }}"
      - "memory: {{ health_memory.stdout_lines | default([]) }}"
      - "time_sync: {{ health_time_sync.stdout | default('n/a') }}"
      - "dns: {{ health_dns.stdout | default('n/a') }}"
      - "ping: {{ health_ping.rc | default('n/a') }}"
      - "tailscale: {{ health_tailscale.stdout | default('n/a') }}"
      - "kube_health: {{ health_kube.stdout | default('n/a') }}"
      - "log_matches: {{ health_log_matches | default({}) }}"

- name: Write health report
  ansible.builtin.template:
    src: healthcheck_report.txt.j2
    dest: "{{ healthcheck_report_path }}"
    mode: "0644"
  when: healthcheck_write_report | bool
  notify: Healthcheck report written
