---
- name: Reload systemd for the host agent
  tags: [service]
  ansible.builtin.systemd_service:
    daemon_reload: true

# The agent holds a database and a certificate; a restart is quick and safe, and it
# is the only way a new binary takes effect.
- name: Restart the host agent
  tags: [service]
  ansible.builtin.systemd_service:
    name: "{{ host_agent_service_unit }}"
    state: restarted

- name: Reload the firewall for the host agent
  tags: [firewall]
  ansible.builtin.command: firewall-cmd --reload
