---
# Kept separate so the input rules can be tested without touching a host.
- name: Validate the host-agent inputs
  ansible.builtin.assert:
    that:
      - (host_agent_binary_src | length > 0) != (host_agent_binary_url | length > 0)
      - host_agent_binary_url | length == 0 or host_agent_binary_checksum is match("^sha256:[0-9a-f]{64}$")
      - host_agent_port | int > 0
      - >-
        (host_agent_cluster_url | length == 0 and host_agent_join_token | length == 0)
        or (host_agent_cluster_url | length > 0 and host_agent_cluster_fingerprint | length > 0 and host_agent_join_token | length > 0)
    fail_msg: >-
      Set exactly one binary source (host_agent_binary_src, or host_agent_binary_url
      with a sha256 host_agent_binary_checksum). To join a cluster agent, set the
      cluster URL, its certificate fingerprint, and a join token together.
