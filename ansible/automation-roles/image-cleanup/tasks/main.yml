---
- name: Validate the image-cleanup policy handoff
  ansible.builtin.assert:
    that:
      - image_cleanup is mapping
      - image_cleanup.enabled is boolean
      - image_cleanup.checkOnly is boolean
      - image_cleanup.level in ["careful", "aggressive"]
      - image_cleanup.time is match("^([01][0-9]|2[0-3]):[0-5][0-9]$")
      - image_cleanup.maxImagesPerRun | int > 0
      - image_cleanup.onlyIfDiskOverPercent | int >= 0
    fail_msg: >-
      Image cleanup requires a validated spec.imageCleanup profile.

# Installing the binary is skipped when the policy is off, but the units and the
# timer state below are always reconciled so a disabled policy stops the timer.
- name: Install the adaetum-agent binary
  ansible.builtin.copy:
    src: "{{ image_cleanup_agent_src }}"
    dest: "{{ image_cleanup_agent_path }}"
    owner: root
    group: root
    mode: "0755"
  when:
    - image_cleanup.enabled | bool
    - image_cleanup_agent_src | length > 0

- name: Check that the adaetum-agent binary is present
  ansible.builtin.stat:
    path: "{{ image_cleanup_agent_path }}"
  register: image_cleanup_agent
  when: image_cleanup.enabled | bool

- name: Fail clearly when cleanup is enabled but the agent is not installed
  ansible.builtin.fail:
    msg: >-
      spec.imageCleanup.enabled is true but {{ image_cleanup_agent_path }} is not
      on this host. Set image_cleanup_agent_src to a built adaetum-agent binary,
      or install it first.
  when:
    - image_cleanup.enabled | bool
    - not image_cleanup_agent.stat.exists

- name: Render the image-cleanup service
  ansible.builtin.template:
    src: adaetum-image-cleanup.service.j2
    dest: "/etc/systemd/system/{{ image_cleanup_service_unit }}"
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd for image cleanup

- name: Render the image-cleanup timer
  ansible.builtin.template:
    src: adaetum-image-cleanup.timer.j2
    dest: "/etc/systemd/system/{{ image_cleanup_timer_unit }}"
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd for image cleanup

- name: Apply unit changes before changing timer state
  ansible.builtin.meta: flush_handlers

- name: Reconcile the image-cleanup timer state
  ansible.builtin.systemd_service:
    name: "{{ image_cleanup_timer_unit }}"
    enabled: "{{ image_cleanup.enabled | bool }}"
    state: "{{ 'started' if image_cleanup.enabled | bool else 'stopped' }}"
