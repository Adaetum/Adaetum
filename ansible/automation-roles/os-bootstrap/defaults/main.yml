---
# Default variables for os-bootstrap
os_bootstrap_packages:
  - curl
  - vim
  - jq
  - git
  - ca-certificates
  - chrony
  - iscsi-initiator-utils
  - nfs-utils
  - cryptsetup

os_bootstrap_services:
  - chronyd
  - iscsid

os_bootstrap_disable_swap: true
os_bootstrap_manage_fstab: true
os_bootstrap_manage_networkmanager_wired: true
os_bootstrap_network_connection_prefix: "ks-ipv4-"
os_bootstrap_network_autoconnect_priority: 100

# Kernel modules required for Kubernetes networking and storage.
os_bootstrap_kernel_modules:
  - br_netfilter
  - overlay
  - dm_crypt

# Sysctl defaults needed for pod networking on RHEL/Rocky, plus inotify limits.
# Every container and kubelet watch runs as root and shares one per-user inotify
# pool; the default of 128 instances runs out on a single-node cluster, after
# which systemd cannot start a root user manager ("Failed to allocate manager
# object: Too many open files") and new root sessions misbehave.
os_bootstrap_sysctl:
  - name: net.ipv4.ip_forward
    value: "1"
  - name: net.bridge.bridge-nf-call-iptables
    value: "1"
  - name: net.bridge.bridge-nf-call-ip6tables
    value: "1"
  - name: net.ipv4.conf.all.rp_filter
    value: "0"
  - name: net.ipv4.conf.default.rp_filter
    value: "0"
  - name: fs.inotify.max_user_instances
    value: "8192"
  - name: fs.inotify.max_user_watches
    value: "524288"
