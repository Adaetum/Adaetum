<svg xmlns="http://www.w3.org/2000/svg" width="4000" height="3000" viewBox="0 0 4000 3000">
  <!-- Structural reference for generating separate installer art. One leaf is 700 x 1050 (2:3). -->
  <defs>
    <linearGradient id="cover" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#744333"/><stop offset=".48" stop-color="#522b23"/><stop offset="1" stop-color="#271713"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#d1ba8c"/><stop offset=".1" stop-color="#eadbb8"/><stop offset=".52" stop-color="#f5e9cc"/><stop offset=".9" stop-color="#eadab6"/><stop offset="1" stop-color="#cbb181"/>
    </linearGradient>
    <linearGradient id="paperLeft" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#e9d8b5"/><stop offset=".82" stop-color="#f2e4c5"/><stop offset="1" stop-color="#c9b084"/>
    </linearGradient>
    <linearGradient id="paperRight" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#c9b084"/><stop offset=".18" stop-color="#f2e4c5"/><stop offset="1" stop-color="#e9d8b5"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f6dda3"/><stop offset=".45" stop-color="#be8d44"/><stop offset=".72" stop-color="#e6bf78"/><stop offset="1" stop-color="#8e622b"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#c1aa81"/><stop offset=".5" stop-color="#ead9b6"/><stop offset="1" stop-color="#a88d63"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="150%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="16"/><feOffset dy="22"/>
      <feComponentTransfer><feFuncA type="linear" slope=".22"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="pageLines" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M0 0H20" stroke="#a88b5f" stroke-width="1" opacity=".17"/>
    </pattern>
    <style>
      .title{font:600 54px Georgia,serif;letter-spacing:3px;fill:#38291e}
      .subtitle{font:30px Georgia,serif;fill:#6b5945}
      .label{font:600 35px Georgia,serif;letter-spacing:2px;fill:#54402e}
      .small{font:27px Georgia,serif;fill:#79664e}
      .guide{stroke:#b8a58a;stroke-width:3;stroke-dasharray:12 14;fill:none}
    </style>
  </defs>

  <rect width="4000" height="3000" fill="#f4f0e8"/>
  <path d="M110 206H3890" stroke="#bca889" stroke-width="3"/>
  <text x="130" y="108" class="title">ADAETUM / INSTALLER ART SOURCE</text>
  <text x="132" y="165" class="subtitle">Shared geometry · isolated surfaces · animated lock components · no UI copy baked into art</text>

  <!-- Exterior front: spine on the left, latch and free edge on the right. -->
  <text x="190" y="278" class="label">FRONT COVER / CLOSED</text>
  <g id="front-cover" transform="translate(180 330)" filter="url(#shadow)">
    <rect x="32" y="22" width="700" height="1050" rx="24" fill="url(#edge)" stroke="#7d6040" stroke-width="8"/>
    <rect x="0" y="0" width="700" height="1050" rx="24" fill="url(#cover)" stroke="#2d1b17" stroke-width="11"/>
    <path d="M38 17V1033" stroke="#1c100e" stroke-width="36" opacity=".55"/>
    <path d="M67 28V1022" stroke="url(#gold)" stroke-width="7" opacity=".8"/>
    <rect x="84" y="43" width="571" height="963" rx="12" fill="none" stroke="url(#gold)" stroke-width="11"/>
    <rect x="106" y="65" width="527" height="919" rx="8" fill="none" stroke="#e9c785" stroke-width="3" opacity=".75"/>
    <path d="M95 160H641" stroke="url(#gold)" stroke-width="6"/>
    <!-- A smaller seal leaves a continuous inscription area below it. -->
    <g transform="translate(370 445) scale(.72) translate(-370 -515)">
    <circle cx="370" cy="515" r="222" fill="#301a16" fill-opacity=".42" stroke="url(#gold)" stroke-width="14"/>
    <circle cx="370" cy="515" r="196" fill="none" stroke="#e9c785" stroke-width="4"/>
    <path d="M249 657V498a121 121 0 0 1 242 0v159" fill="none" stroke="#c59b57" stroke-width="12" opacity=".82"/>
    <text x="370" y="660" text-anchor="middle" font-family="Georgia,serif" font-size="330" fill="url(#gold)" stroke="#3d211a" stroke-width="3" paint-order="stroke">A</text>
    </g>
    <circle cx="670" cy="525" r="26" fill="url(#gold)" stroke="#6f4c29" stroke-width="6"/>
    <circle cx="670" cy="525" r="9" fill="#35231b"/>
  </g>

  <!-- Open spread: the cover and page block remain behind two independent leaf faces. -->
  <text x="1150" y="278" class="label">OPEN SPREAD / SHARED SPINE</text>
  <g id="open-spread" transform="translate(1120 330)" filter="url(#shadow)">
    <rect x="-21" y="-20" width="1442" height="1094" rx="32" fill="url(#cover)" stroke="#352019" stroke-width="8"/>
    <rect x="-6" y="12" width="1412" height="1056" rx="14" fill="url(#edge)" stroke="#9e825d" stroke-width="6"/>
    <path d="M0 1043Q700 1093 1400 1043" fill="none" stroke="#9f8663" stroke-width="38"/>
    <path d="M0 1037Q700 1085 1400 1037" fill="none" stroke="#f0e2c3" stroke-width="21" stroke-dasharray="4 5" opacity=".7"/>
    <path d="M0 0H700V1050H0Q-6 521 0 0Z" fill="url(#paperLeft)" stroke="#b99e72" stroke-width="5"/>
    <path d="M700 0H1400Q1406 520 1400 1050H700Z" fill="url(#paperRight)" stroke="#b99e72" stroke-width="5"/>
    <path d="M33 26H668V1015H33ZM732 26H1367V1015H732Z" fill="none" stroke="#a98b5b" stroke-width="3" opacity=".55"/>
    <path d="M700 0V1050" stroke="#5d4229" stroke-width="34" opacity=".19"/>
    <path d="M700 0V1050" stroke="#f9edcf" stroke-width="5" opacity=".7"/>
    <!-- Keep ornaments outside the live text area, which varies by question. -->
    <g fill="none" stroke="#b69a6d" stroke-width="3" opacity=".52">
      <path d="M48 88V42h46M652 88V42h-46M48 953v46h46M652 953v46h-46"/>
      <path d="M748 88V42h46M1352 88V42h-46M748 953v46h46M1352 953v46h-46"/>
    </g>
  </g>

  <!-- This effect is a separate transparent overlay, never printed on the book. -->
  <text x="2653" y="550" class="label">MAGIC FX</text>
  <g id="magic-fx" transform="translate(2817 864)" fill="none" stroke="url(#gold)">
    <circle r="164" stroke-width="9" opacity=".75"/>
    <circle r="125" stroke-width="3" opacity=".65"/>
    <circle r="81" stroke-width="5" opacity=".5"/>
    <path d="M0-214V-181M0 181v33M-214 0h33M181 0h33M-151-151l24 24M127 127l24 24M151-151l-24 24M-127 127l-24 24" stroke-width="8" stroke-linecap="round"/>
    <path d="M0-115L101 58H-101Z" stroke-width="8"/>
    <circle r="25" stroke-width="7"/>
    <path d="M-210-236l7 17 17 7-17 7-7 17-7-17-17-7 17-7zM222 114l6 14 14 6-14 6-6 14-6-14-14-6 14-6z" fill="#d5a960" stroke="none"/>
  </g>

  <!-- Back exterior deliberately matches the front's material and border. -->
  <text x="3040" y="278" class="label">BACK COVER / CLOSED</text>
  <g id="back-cover" transform="translate(3100 330)" filter="url(#shadow)">
    <rect x="-23" y="20" width="700" height="1050" rx="24" fill="url(#edge)" stroke="#7d6040" stroke-width="8"/>
    <rect width="700" height="1050" rx="24" fill="url(#cover)" stroke="#2d1b17" stroke-width="11"/>
    <path d="M662 18V1032" stroke="#1c100e" stroke-width="34" opacity=".48"/>
    <path d="M632 28V1022" stroke="url(#gold)" stroke-width="7" opacity=".8"/>
    <rect x="45" y="43" width="570" height="963" rx="12" fill="none" stroke="url(#gold)" stroke-width="11"/>
    <rect x="67" y="65" width="526" height="919" rx="8" fill="none" stroke="#e9c785" stroke-width="3" opacity=".75"/>
    <path d="M56 182H604M56 866H604" stroke="url(#gold)" stroke-width="9"/>
    <circle cx="330" cy="525" r="190" fill="none" stroke="#c49a59" stroke-width="10" opacity=".65"/>
    <path d="M330 346v358M152 525h356M203 398l254 254M457 398L203 652" stroke="#c49a59" stroke-width="5" opacity=".45"/>
    <circle cx="330" cy="525" r="48" fill="#3c221a" stroke="url(#gold)" stroke-width="8"/>
  </g>

  <path d="M125 1570H3875" stroke="#bca889" stroke-width="3"/>
  <text x="132" y="1644" class="title">SEPARATE SURFACES AND MOVING PARTS</text>
  <text x="135" y="1695" class="subtitle">Keep each silhouette complete, isolated, and at the same camera angle. The blank centers receive live installer text.</text>

  <!-- Interior cover: visible during the first and last page turns. -->
  <text x="168" y="1793" class="label">INSIDE FRONT COVER</text>
  <g id="inside-cover" transform="translate(220 1830) scale(.7)" filter="url(#shadow)">
    <rect width="700" height="1050" rx="24" fill="url(#cover)" stroke="#2d1b17" stroke-width="10"/>
    <rect x="49" y="43" width="603" height="963" rx="13" fill="url(#paper)" stroke="url(#gold)" stroke-width="15"/>
    <rect x="78" y="72" width="545" height="905" rx="6" fill="none" stroke="#aa8a58" stroke-width="4" opacity=".7"/>
    <path d="M58 177H641M58 874H641" stroke="#ad8d61" stroke-width="4" opacity=".5"/>
    <path d="M33 17V1033" stroke="#21140f" stroke-width="24" opacity=".5"/>
  </g>

  <!-- Mirrored leaf faces. Tabs are voids in the paper silhouette, never translucent paper. -->
  <text x="930" y="1793" class="label">LEFT LEAF / PREVIOUS</text>
  <g id="left-leaf" transform="translate(943 1830) scale(.7)" filter="url(#shadow)">
    <path d="M0 0H700V1050H0V681H37Q72 681 72 646V595Q72 560 37 560H0V0Z" fill="url(#paperLeft)" fill-rule="evenodd" stroke="#a98c60" stroke-width="6"/>
    <path d="M52 50H650V1000H52Z" fill="none" stroke="#b2966c" stroke-width="3" opacity=".6"/>
    <path d="M80 142H620M80 917H620" stroke="#b2966c" stroke-width="3" opacity=".45"/>
  </g>
  <text x="1660" y="1793" class="label">RIGHT LEAF / CURRENT</text>
  <g id="right-leaf" transform="translate(1672 1830) scale(.7)" filter="url(#shadow)">
    <path d="M0 0H700V560H663Q628 560 628 595V646Q628 681 663 681H700V1050H0Z" fill="url(#paperRight)" fill-rule="evenodd" stroke="#a98c60" stroke-width="6"/>
    <path d="M50 50H648V1000H50Z" fill="none" stroke="#b2966c" stroke-width="3" opacity=".6"/>
    <path d="M80 142H620M80 917H620" stroke="#b2966c" stroke-width="3" opacity=".45"/>
  </g>

  <!-- Exploded hardware. The mounted eye stays on the cover; the strap pivots; the shackle opens; the body leaves. -->
  <text x="2400" y="1793" class="label">LOCK / EXPLODED ANIMATION PARTS</text>
  <path d="M2380 1820H3830V2762H2380Z" class="guide"/>
  <text x="2470" y="1885" class="small">1 · cover hinge and strap</text>
  <g id="lock-strap" transform="translate(2440 1935)">
    <rect x="0" y="78" width="115" height="170" rx="20" fill="url(#gold)" stroke="#6d4a29" stroke-width="8"/>
    <circle cx="57" cy="163" r="25" fill="#4e3020" stroke="#f3d89c" stroke-width="8"/>
    <path d="M112 96H428Q469 96 491 136V198Q469 238 428 238H112Z" fill="url(#gold)" stroke="#6d4a29" stroke-width="8"/>
    <path d="M152 122H418Q448 122 459 151V185Q448 212 418 212H152" fill="none" stroke="#f6dea2" stroke-width="5" opacity=".85"/>
    <circle cx="413" cy="167" r="37" fill="#4c2d1c" stroke="#8b642f" stroke-width="9"/>
    <circle cx="413" cy="167" r="18" fill="#f4f0e8" stroke="#704b29" stroke-width="5"/>
  </g>
  <text x="3175" y="1885" class="small">2 · fixed cover eye</text>
  <g id="lock-eye" transform="translate(3180 1950)">
    <rect x="0" y="48" width="400" height="180" rx="30" fill="url(#gold)" stroke="#674728" stroke-width="9"/>
    <circle cx="200" cy="138" r="83" fill="#533524" stroke="#f7dfa5" stroke-width="14"/>
    <circle cx="200" cy="138" r="48" fill="#f4f0e8" stroke="#704b29" stroke-width="11"/>
    <circle cx="49" cy="138" r="11" fill="#5e4029"/><circle cx="351" cy="138" r="11" fill="#5e4029"/>
  </g>
  <text x="2468" y="2310" class="small">3 · opening shackle</text>
  <g id="lock-shackle" transform="translate(2500 2365)">
    <path d="M33 221V102A104 104 0 0 1 241 102V221" fill="none" stroke="#6b4a29" stroke-width="76" stroke-linecap="round"/>
    <path d="M33 221V102A104 104 0 0 1 241 102V221" fill="none" stroke="url(#gold)" stroke-width="58" stroke-linecap="round"/>
    <path d="M45 205V102A92 92 0 0 1 229 102V205" fill="none" stroke="#ffe5ae" stroke-width="7" opacity=".7"/>
    <circle cx="241" cy="221" r="24" fill="#5d3c25" stroke="#e6be78" stroke-width="8"/>
  </g>
  <text x="3150" y="2310" class="small">4 · departing lock body</text>
  <g id="lock-body" transform="translate(3200 2360)">
    <rect x="0" y="0" width="310" height="360" rx="58" fill="url(#gold)" stroke="#684522" stroke-width="13"/>
    <rect x="26" y="29" width="258" height="299" rx="39" fill="none" stroke="#fff0c2" stroke-width="7" opacity=".7"/>
    <path d="M154 130a47 47 0 1 1 0 94l-14 62h29l-14-62" fill="#5a3820" stroke="#3f2719" stroke-width="8"/>
    <path d="M70 78H240M70 285H240" stroke="#9d6c32" stroke-width="5" opacity=".7"/>
  </g>

  <text x="142" y="2900" class="subtitle">Construction guide only · Front and back are related but distinct · Text, tab labels, and glow remain independent UI layers</text>
</svg>
