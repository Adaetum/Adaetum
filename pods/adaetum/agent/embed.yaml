apiVersion: apps/v1
kind: Deployment
metadata:
  name: adaetum-embed
  namespace: adaetum
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: adaetum-embed
  template:
    metadata:
      labels:
        app.kubernetes.io/name: adaetum-embed
        app.kubernetes.io/part-of: adaetum
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/arch: amd64
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: embed
          image: adaetum-embed
          args: ["-listen", ":8080", "-threads", "2"]
          ports:
            - {name: http, containerPort: 8080}
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            timeoutSeconds: 6
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: {cpu: 250m, memory: 256Mi}
            limits: {cpu: "2", memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: adaetum-embed
  namespace: adaetum
spec:
  selector:
    app.kubernetes.io/name: adaetum-embed
  ports:
    - {name: http, port: 80, targetPort: http}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: adaetum-embed
  namespace: adaetum
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: adaetum-embed
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: adaetum-cluster-agent
      ports:
        - {port: 8080, protocol: TCP}
  egress: []
