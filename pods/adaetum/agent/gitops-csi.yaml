apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: adaetum-agent-gitops
  namespace: adaetum
spec:
  provider: openbao
  parameters:
    roleName: adaetum-agent-gitops
    objects: |
      - objectName: token
        secretPath: secret/data/apps/adaetum/gitops-update
        secretKey: token
