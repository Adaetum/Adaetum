apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - serviceaccount.yaml
  - adaetum-agent-cluster-config.yaml
  - gitops-csi.yaml
  - ansible-job-rbac.yaml
  - volume.yaml
  - deployment.yaml
  - service.yaml
  - embed.yaml
# Initial release tags are replaced with the published digests before activation.
images:
  - name: adaetum-agent
    newName: ghcr.io/adaetum/adaetum-agent
    newTag: adaetum-v0.1.0
  - name: adaetum-auth
    newName: ghcr.io/adaetum/adaetum-auth
    newTag: adaetum-v0.1.0
  - name: adaetum-embed
    newName: ghcr.io/adaetum/adaetum-embed
    newTag: adaetum-v0.1.0
