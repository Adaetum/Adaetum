apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: adaetum-agent-owner
  namespace: adaetum
spec:
  provider: openbao
  parameters:
    roleName: adaetum-agent-owner
    objects: |
      - objectName: email
        secretPath: secret/data/apps/adaetum/break-glass
        secretKey: email
      - objectName: password
        secretPath: secret/data/apps/adaetum/break-glass
        secretKey: password
