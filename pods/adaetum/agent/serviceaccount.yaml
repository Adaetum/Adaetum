apiVersion: v1
kind: ServiceAccount
metadata:
  name: adaetum-cluster-agent
  namespace: adaetum
---
# Node discovery is read-only. The agent cannot create workloads or exec into
# pods using this identity; host changes remain behind the Ansible boundary.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: adaetum-cluster-agent-nodes
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: adaetum-cluster-agent-nodes
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: adaetum-cluster-agent-nodes
subjects:
  - kind: ServiceAccount
    name: adaetum-cluster-agent
    namespace: adaetum
---
# The cluster agent's overview, workloads and storage pages show the same cluster report a
# host agent builds with kubectl, here read through this identity (internal/cluster/kubeget.go
# lists exactly these kinds). Reading only: no secrets, no pods/exec, no nodes/proxy, and no
# write verb. Add a kind here only together with that list.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: adaetum-cluster-agent-report
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "events", "persistentvolumeclaims"]
    verbs: ["list"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets"]
    verbs: ["list"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["list"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["list"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["list"]
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    verbs: ["list"]
  - apiGroups: ["cert-manager.io"]
    resources: ["certificates"]
    verbs: ["list"]
  - apiGroups: ["longhorn.io"]
    resources: ["volumes", "nodes"]
    verbs: ["list"]
  - apiGroups: ["longhorn.io"]
    resources: ["settings"]
    verbs: ["get"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods", "nodes"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: adaetum-cluster-agent-report
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: adaetum-cluster-agent-report
subjects:
  - kind: ServiceAccount
    name: adaetum-cluster-agent
    namespace: adaetum
---
# The agent publishes its own address and certificate fingerprint so host agents can adopt
# themselves (adaetum/agent/docs/cluster.md, "Adopting a host automatically"). It may touch
# exactly one ConfigMap in its own namespace; creating one cannot be limited by name.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: adaetum-cluster-agent-endpoint
  namespace: adaetum
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["adaetum-cluster-agent-endpoint"]
    verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: adaetum-cluster-agent-endpoint
  namespace: adaetum
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: adaetum-cluster-agent-endpoint
subjects:
  - kind: ServiceAccount
    name: adaetum-cluster-agent
    namespace: adaetum
