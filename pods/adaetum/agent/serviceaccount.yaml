apiVersion: v1
kind: ServiceAccount
metadata:
  name: adaetum-cluster-agent
  namespace: adaetum
---
# Node discovery is read-only. The agent cannot create workloads or exec into
# pods using this identity; host changes remain behind the Ansible boundary.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: adaetum-cluster-agent-nodes
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: adaetum-cluster-agent-nodes
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: adaetum-cluster-agent-nodes
subjects:
  - kind: ServiceAccount
    name: adaetum-cluster-agent
    namespace: adaetum
