apiVersion: apps/v1
kind: Deployment
metadata:
  name: ansible-runner
  namespace: ansible
  annotations:
    secret.reloader.stakater.com/reload: gitea-registry-creds
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ansible-runner
  template:
    metadata:
      labels:
        app: ansible-runner
    spec:
      serviceAccountName: ansible-runner
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      imagePullSecrets:
        - name: gitea-registry-creds
      containers:
        - name: ansible-runner
          image: registry.adaetum.invalid/gitea-admin/ansible-runner:build-33d4e9a30497b504
          imagePullPolicy: Always
          resources:
            requests:
              memory: 64Mi
              cpu: 10m
            limits:
              memory: 256Mi
          env:
            - name: CRON_SCHEDULE
              value: "*/10 * * * *"
            - name: ANSIBLE_PLAYBOOK
              value: "playbooks/day2.yml"
            - name: ANSIBLE_INVENTORY
              value: "node-inventory.yml"
            - name: ANSIBLE_EXTRA_ARGS
              value: ""
            - name: TAILSCALE_DOMAIN
              value: "example-tailnet.ts.net"
            - name: TAILSCALE_TAILNET
              value: "example-tailnet.ts.net"
            - name: TAILSCALE_CLUSTER_TAG
              value: "tag:cluster"
            # Inside this pod "local" would mean the container, so the node it runs on is
            # managed over SSH to loopback with this per-node key (see build-inventory).
            - name: ANSIBLE_LOCAL_SSH_KEY
              value: "/run/adaetum-ssh/id_ed25519"
          volumeMounts:
            - name: ansible-data
              mountPath: /ansible
            - name: day2-secrets
              mountPath: /run/secrets/adaetum
              readOnly: true
            - name: runner-ssh
              mountPath: /run/adaetum-ssh
              readOnly: true
      volumes:
        - name: ansible-data
          hostPath:
            path: /opt/ansible-runner
            type: Directory
        # Made on each node when it installs (ks-src ... 22-ansible-bundle-flow). Created empty
        # if missing so an older node still starts the pod; the inventory then skips the local
        # node instead of acting on the container.
        - name: runner-ssh
          hostPath:
            path: /var/lib/adaetum/runner-ssh
            type: DirectoryOrCreate
        - name: day2-secrets
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: ansible-runner-openbao
