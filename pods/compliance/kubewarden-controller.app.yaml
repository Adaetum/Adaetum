name: kubewarden-controller
project: default
annotations:
  argocd.argoproj.io/sync-wave: "-19"
source_type: helm
source_repo_url: https://charts.kubewarden.io
source_chart: kubewarden-controller
source_target_revision: "5.14.0"
source_helm_values: |
  # Keep continuous policy evaluation available for resources that predate a
  # policy. Policy Reporter is intentionally disabled because Adaetum already
  # exposes compliance results through Kubescape and does not deploy its UI.
  auditScanner:
    enable: true
    policyReporter: false

  telemetry:
    # Sidecar telemetry requires the OpenTelemetry Operator to inject and own
    # an OpenTelemetryCollector. Adaetum does not carry that additional
    # operator solely for Kubewarden, whose workload state remains covered by
    # kube-state-metrics.
    metrics: false
    tracing: false
destination_namespace: kubewarden
