name: kubewarden-defaults
project: default
annotations:
  argocd.argoproj.io/sync-wave: "-18"
source_type: helm
source_repo_url: https://charts.kubewarden.io
source_chart: kubewarden-defaults
source_target_revision: "3.14.0"
source_helm_values: |
  # The defaults chart owns the PolicyServer lifecycle. Policies remain
  # explicit repository manifests so policy behavior is reviewable in pods/.
  policyServer:
    enabled: true
    replicaCount: 1

  recommendedPolicies:
    enabled: false
destination_namespace: kubewarden
