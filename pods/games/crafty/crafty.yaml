apiVersion: v1
kind: ServiceAccount
metadata:
  name: crafty-credential-sync
  namespace: games
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crafty
  namespace: games
  labels:
    app.kubernetes.io/name: crafty
spec:
  # Crafty owns mutable server processes and files on one RWO volume. Keep the
  # replica count and resources in Git; HPA, VPA, and descheduler do not own it.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: crafty
  template:
    metadata:
      labels:
        app.kubernetes.io/name: crafty
    spec:
      # This identity can write only Crafty's generated administrator
      # credential to its dedicated OpenBao path.
      serviceAccountName: crafty-credential-sync
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 0
        fsGroup: 0
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        - name: prepare-data
          image: busybox:1.38.0@sha256:fd8d9aa63ba2f0982b5304e1ee8d3b90a210bc1ffb5314d980eb6962f1a9715d
          command:
            - /bin/sh
            - -ec
          args:
            - |
              mkdir -p /data/backups /data/logs /data/servers /data/config /data/import
              chgrp -R 0 /data
              chmod -R g+rwX /data
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "FOWNER"]
          volumeMounts:
            - name: data
              mountPath: /data
      containers:
        - name: crafty
          image: registry.gitlab.com/crafty-controller/crafty-4:4.10.7@sha256:67c2cbab1c88b75efb41b2970b1faca1a736b3532f6d1a806a7fe3f81664a199
          imagePullPolicy: IfNotPresent
          env:
            - name: TZ
              value: Etc/UTC
          resources:
            requests:
              cpu: "1"
              memory: 4Gi
            limits:
              cpu: "4"
              memory: 8Gi
          ports:
            - name: panel-https
              containerPort: 8443
              protocol: TCP
            - name: bedrock
              containerPort: 19132
              protocol: UDP
          startupProbe:
            httpGet:
              scheme: HTTPS
              path: /
              port: panel-https
            failureThreshold: 60
            periodSeconds: 5
          readinessProbe:
            httpGet:
              scheme: HTTPS
              path: /
              port: panel-https
            periodSeconds: 10
          livenessProbe:
            httpGet:
              scheme: HTTPS
              path: /
              port: panel-https
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /crafty/backups
              subPath: backups
            - name: data
              mountPath: /crafty/logs
              subPath: logs
            - name: data
              mountPath: /crafty/servers
              subPath: servers
            - name: data
              mountPath: /crafty/app/config
              subPath: config
            - name: data
              mountPath: /crafty/import
              subPath: import
        - name: credential-sync
          image: ghcr.io/openbao/openbao:2.6.1@sha256:5b2486ab0fb90bbc788cc345b0a08616dfb375873ee8be5df3a2fd4d378a67e0
          env:
            - name: BAO_ADDR
              value: http://openbao.openbao.svc.cluster.local:8200
          command:
            - /bin/sh
            - -ec
          args:
            - |
              # Crafty creates this JSON file on its first start. Promote the
              # native username/password into durable recovery storage without
              # exposing either value in process arguments or Kubernetes logs.
              until [ -s /crafty-config/default-creds.txt ]; do
                sleep 2
              done
              BAO_TOKEN="$(bao write -field=token auth/kubernetes/login \
                role=crafty-credential-sync \
                jwt="$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)")"
              export BAO_TOKEN
              bao kv put secret/apps/games/crafty/admin \
                @/crafty-config/default-creds.txt >/dev/null
              unset BAO_TOKEN

              # Keep this one-shot companion healthy after the promotion. A
              # pod restart retries the write if OpenBao was temporarily down.
              while :; do sleep 3600; done
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /crafty-config
              subPath: config
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: crafty
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: crafty
  namespace: games
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 50Gi
---
apiVersion: v1
kind: Service
metadata:
  name: crafty
  namespace: games
spec:
  selector:
    app.kubernetes.io/name: crafty
  ports:
    - name: panel-https
      port: 8443
      targetPort: panel-https
      protocol: TCP
    - name: bedrock
      port: 19132
      targetPort: bedrock
      protocol: UDP
