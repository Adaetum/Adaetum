apiVersion: v1
kind: ServiceAccount
metadata:
  name: crafty-credential-sync
  namespace: games
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crafty
  namespace: games
  labels:
    app.kubernetes.io/name: crafty
spec:
  # Crafty owns mutable server processes and files on one RWO volume. Keep the
  # replica count and resources in Git; HPA, VPA, and descheduler do not own it.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: crafty
  template:
    metadata:
      labels:
        app.kubernetes.io/name: crafty
    spec:
      # This identity can read only Crafty's desired administrator credential.
      serviceAccountName: crafty-credential-sync
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 0
        fsGroup: 0
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        - name: prepare-data
          image: busybox:1.38.0@sha256:fd8d9aa63ba2f0982b5304e1ee8d3b90a210bc1ffb5314d980eb6962f1a9715d
          command:
            - /bin/sh
            - -ec
          args:
            - |
              mkdir -p /data/backups /data/logs /data/servers /data/config /data/import
              chgrp -R 0 /data
              chmod -R g+rwX /data
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "FOWNER"]
          volumeMounts:
            - name: data
              mountPath: /data
      containers:
        - name: crafty
          image: registry.gitlab.com/crafty-controller/crafty-4:4.10.7@sha256:67c2cbab1c88b75efb41b2970b1faca1a736b3532f6d1a806a7fe3f81664a199
          imagePullPolicy: IfNotPresent
          env:
            - name: TZ
              value: Etc/UTC
          resources:
            requests:
              cpu: "1"
              memory: 4Gi
            limits:
              cpu: "4"
              memory: 8Gi
          ports:
            - name: panel-https
              containerPort: 8443
              protocol: TCP
            - name: bedrock
              containerPort: 19132
              protocol: UDP
          startupProbe:
            httpGet:
              scheme: HTTPS
              path: /
              port: panel-https
            failureThreshold: 60
            periodSeconds: 5
          readinessProbe:
            httpGet:
              scheme: HTTPS
              path: /
              port: panel-https
            periodSeconds: 10
          livenessProbe:
            httpGet:
              scheme: HTTPS
              path: /
              port: panel-https
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /crafty/backups
              subPath: backups
            - name: data
              mountPath: /crafty/logs
              subPath: logs
            - name: data
              mountPath: /crafty/servers
              subPath: servers
            - name: data
              mountPath: /crafty/app/config
              subPath: config
            - name: data
              mountPath: /crafty/import
              subPath: import
        - name: credential-sync
          image: alpine/k8s:1.35.6@sha256:b7a12c5ddf261994c33d2eaaa06fd69a0803ff6b38683bfa3d30a76dcdf92807
          command:
            - /bin/sh
            - -ec
          args:
            - |
              umask 077
              api=https://127.0.0.1:8443/api/v2
              login_json=/tmp/crafty-login.json
              login_response=/tmp/crafty-login-response.json
              cookie_jar=/tmp/crafty-cookie
              patch_json=/tmp/crafty-patch.json
              patch_response=/tmp/crafty-patch-response.json
              active_username=/tmp/crafty-active-username
              active_credential_file=/tmp/crafty-active-password
              ready_file=/tmp/crafty-credential-ready

              cleanup() {
                rm -f "${login_json}" "${login_response}" "${cookie_jar}" \
                  "${patch_json}" "${patch_response}" "${active_username}" \
                  "${active_credential_file}" "${ready_file}"
              }
              trap cleanup EXIT

              login_with_files() {
                username_file="$1"
                credential_file="$2"
                rm -f "${cookie_jar}" "${login_response}"
                jq -n \
                  --rawfile username "${username_file}" \
                  --rawfile password "${credential_file}" \
                  '{username: $username, password: $password}' >"${login_json}"
                status="$(curl -ksS -o "${login_response}" -w '%{http_code}' \
                  -c "${cookie_jar}" -H 'Content-Type: application/json' \
                  --data-binary "@${login_json}" "${api}/auth/login")"
                [ "${status}" = 200 ] && jq -e '.status == "ok"' "${login_response}" >/dev/null
              }

              apply_desired_password() {
                username_file="$1"
                credential_file="$2"
                login_with_files "${username_file}" "${credential_file}" || return 1
                jq -n --rawfile password /run/openbao/password \
                  '{password: $password}' >"${patch_json}"
                status="$(curl -ksS -o "${patch_response}" -w '%{http_code}' \
                  -b "${cookie_jar}" -X PATCH -H 'Content-Type: application/json' \
                  --data-binary "@${patch_json}" "${api}/users/@me")"
                [ "${status}" = 200 ] && jq -e '.status == "ok"' "${patch_response}" >/dev/null
              }

              until curl -ksSf "${api}/jsonschema/login" >/dev/null 2>&1; do
                sleep 2
              done

              # A converged pod authenticates directly with OpenBao's desired
              # credential. On first adoption only, Crafty's generated file is
              # used to authorize the native password update through its API.
              if login_with_files /run/openbao/username /run/openbao/password; then
                cp /run/openbao/username "${active_username}"
                cp /run/openbao/password "${active_credential_file}"
              else
                until [ -s /crafty-config/default-creds.txt ]; do sleep 2; done
                jq -j '.username' /crafty-config/default-creds.txt >"${active_username}"
                jq -j '.password' /crafty-config/default-creds.txt >"${active_credential_file}"
                if ! apply_desired_password "${active_username}" "${active_credential_file}" || \
                   ! login_with_files /run/openbao/username /run/openbao/password; then
                  echo "Crafty credential reconciliation failed; generated and OpenBao credentials were both rejected." >&2
                  while :; do sleep 600; done
                fi
                cp /run/openbao/username "${active_username}"
                cp /run/openbao/password "${active_credential_file}"
              fi
              touch "${ready_file}"
              echo "Crafty administrator credential matches OpenBao."

              # CSI rotates mounted content in place. Retain the last verified
              # value only in this container's tmpfs so an in-place OpenBao
              # password update can authenticate and promote the replacement.
              while :; do
                sleep 30
                if ! cmp -s /run/openbao/password "${active_credential_file}"; then
                  rm -f "${ready_file}"
                  if apply_desired_password "${active_username}" "${active_credential_file}" && \
                     login_with_files /run/openbao/username /run/openbao/password; then
                    cp /run/openbao/username "${active_username}"
                    cp /run/openbao/password "${active_credential_file}"
                    touch "${ready_file}"
                    echo "Crafty administrator password rotation converged."
                  else
                    echo "Crafty administrator password rotation failed; retrying after the login cooldown window." >&2
                    sleep 600
                  fi
                fi
              done
          readinessProbe:
            exec:
              command: ["/bin/sh", "-c", "test -f /tmp/crafty-credential-ready"]
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: openbao
              mountPath: /run/openbao
              readOnly: true
            - name: data
              mountPath: /crafty-config
              subPath: config
              readOnly: true
      volumes:
        - name: openbao
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: crafty-openbao
        - name: data
          persistentVolumeClaim:
            claimName: crafty
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: crafty
  namespace: games
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 50Gi
---
apiVersion: v1
kind: Service
metadata:
  name: crafty
  namespace: games
spec:
  selector:
    app.kubernetes.io/name: crafty
  ports:
    - name: panel-https
      port: 8443
      targetPort: panel-https
      protocol: TCP
    - name: bedrock
      port: 19132
      targetPort: bedrock
      protocol: UDP
