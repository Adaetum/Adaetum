apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: crafty-openbao
  namespace: games
spec:
  provider: openbao
  parameters:
    roleName: crafty-credential-sync
    objects: |
      - objectName: username
        secretPath: secret/data/apps/games/crafty/admin
        secretKey: username
      - objectName: password
        secretPath: secret/data/apps/games/crafty/admin
        secretKey: password
