apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: crafty-ui-public
  namespace: games
  annotations:
    external-dns.alpha.kubernetes.io/hostname: crafty.adaetum.invalid
    # Crafty's native administrator login owns this route. Avoid stacking an
    # Authentik redirect in front of the default no-MFA login flow.
    nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
    nginx.ingress.kubernetes.io/proxy-body-size: "2g"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  rules:
    - host: crafty.adaetum.invalid
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: crafty
                port:
                  number: 8443
