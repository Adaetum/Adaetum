apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: alertmanager-ui-internal
  namespace: observability
spec:
  ingressClassName: nginx
  rules:
    - host: alertmanager.adaetum.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: alertmanager
                port:
                  number: 9093
