apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: prometheus-ui-internal
  namespace: observability
spec:
  ingressClassName: nginx
  rules:
    - host: prometheus.adaetum.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: prometheus-operated
                port:
                  number: 9090
