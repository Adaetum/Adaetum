# Issues and keeps the credentials the MCP servers use (see mint-credentials.sh).
# It authenticates to OpenBao as the mcp-credentials role, which can read the three
# products' administrator logins and write only secret/apps/mcp/{gitea,argocd,grafana}.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: mcp-credentials
  namespace: mcp
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 0
      ttlSecondsAfterFinished: 600
      template:
        spec:
          serviceAccountName: mcp-credentials
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: mint
              # Needs Bash, curl and jq.
              image: alpine/k8s:1.35.6@sha256:b7a12c5ddf261994c33d2eaaa06fd69a0803ff6b38683bfa3d30a76dcdf92807
              imagePullPolicy: IfNotPresent
              command: ["/bin/bash", "/scripts/mint-credentials.sh"]
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  cpu: 200m
                  memory: 128Mi
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
                - name: work
                  mountPath: /work
          volumes:
            - name: scripts
              configMap:
                name: mcp-credentials-script
                defaultMode: 0555
            - name: work
              emptyDir: {}
