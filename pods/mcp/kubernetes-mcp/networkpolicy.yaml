# Only a pod that carries adaetum.io/mcp-client=true (the Adaetum agent, when it
# connects) may reach this server. This server has no caller authentication of its
# own, so this policy is what keeps every other workload out.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kubernetes-mcp
  namespace: mcp
spec:
  podSelector:
    matchLabels:
      app: kubernetes-mcp
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              adaetum.io/mcp-client: "true"
      ports:
        - port: 8080
