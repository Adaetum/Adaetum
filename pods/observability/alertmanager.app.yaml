name: alertmanager
project: default
source_type: helm
source_repo_url: https://prometheus-community.github.io/helm-charts
source_chart: alertmanager
source_target_revision: "1.40.3"
source_helm_values: |
  persistence:
    enabled: true
    storageClass: longhorn
    size: 5Gi
  serviceMonitor:
    enabled: true
    additionalLabels:
      # Rancher's cluster Prometheus selects monitors with this label;
      # Adaetum's Prometheus intentionally discovers all monitor resources.
      release: rancher-monitoring
  config:
    global: {}
    route:
      group_by: ["alertname", "namespace"]
      group_wait: "30s"
      group_interval: "5m"
      repeat_interval: "4h"
      receiver: "null-receiver"
      routes:
        # Keep dead-man and informational control alerts visible without
        # generating periodic ntfy noise.
        - receiver: "null-receiver"
          matchers:
            - 'alertname=~"Watchdog|InfoInhibitor"'
        # Both actionable severities use the supported notification path:
        # Alertmanager -> Apprise -> authenticated ntfy publisher.
        - receiver: "apprise"
          matchers:
            - 'severity=~"warning|critical"'
    inhibit_rules:
      # When the same fault escalates, send the critical notification and
      # suppress its warning counterpart.
      - source_matchers:
          - 'severity="critical"'
        target_matchers:
          - 'severity="warning"'
        equal: ["alertname", "namespace"]
    receivers:
      - name: "apprise"
        webhook_configs:
          - url: "http://apprise.observability.svc.cluster.local:8000/notify/apprise"
            send_resolved: true
            # Alertmanager 0.32+ can shape its generic webhook for Apprise's
            # required notification contract without another bridge service.
            payload:
              title: '{{ if eq .Status "firing" }}FIRING{{ else }}RESOLVED{{ end }}: {{ .CommonLabels.alertname }}'
              body: '{{ range .Alerts }}{{ .Annotations.summary }}{{ if .Annotations.description }} - {{ .Annotations.description }}{{ else if .Annotations.message }} - {{ .Annotations.message }}{{ end }}{{ "\n" }}{{ end }}'
              type: '{{ if eq .Status "resolved" }}success{{ else if eq .CommonLabels.severity "warning" }}warning{{ else }}failure{{ end }}'
      - name: "null-receiver"
destination_namespace: observability
