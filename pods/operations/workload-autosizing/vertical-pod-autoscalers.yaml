# CPU belongs exclusively to each HPA. These VPAs may only tune memory requests,
# leaving hard limits and horizontal scaling stable and Git-owned.
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: cloudflared
  namespace: cloudflared
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cloudflared
  updatePolicy:
    updateMode: InPlace
    minReplicas: 2
  resourcePolicy:
    containerPolicies:
      - containerName: cloudflared
        mode: Auto
        controlledResources:
          - memory
        controlledValues: RequestsOnly
        minAllowed:
          memory: 32Mi
        maxAllowed:
          memory: 256Mi
      - containerName: "*"
        mode: "Off"
---
