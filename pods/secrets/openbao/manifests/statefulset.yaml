apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: openbao
  namespace: openbao
spec:
  serviceName: openbao-internal
  replicas: 1
  selector:
    matchLabels:
      app: openbao
  template:
    metadata:
      labels:
        app: openbao
    spec:
      initContainers:
        - name: openbao-config-sync
          image: busybox:1.38.0@sha256:fd8d9aa63ba2f0982b5304e1ee8d3b90a210bc1ffb5314d980eb6962f1a9715d
          command:
            - sh
            - -c
            - |
              set -e
              mkdir -p /openbao/config
              rm -rf /openbao/config/*
              cp -L /openbao/config-ro/* /openbao/config/
              # Automatic unseal on every restart. The key comes from the bootstrap-owned
              # openbao-static-seal Secret (absent when an external Transit seal is used
              # or on an installation that predates it, which keeps Shamir). The key ID
              # is derived from the key so the two can never disagree.
              if [ -e /openbao/static-seal/key ]; then
                if [ "$(wc -c < /openbao/static-seal/key)" -ne 32 ]; then
                  echo "openbao-static-seal must hold exactly 32 bytes under 'key'" >&2
                  exit 1
                fi
                key_id="$(sha256sum /openbao/static-seal/key | cut -c1-16)"
                printf '\nseal "static" {\n  current_key_id = "%s"\n  current_key = "file:///openbao/static-seal/key"\n}\n' "${key_id}" >> /openbao/config/openbao.hcl
              fi
              chown -R 1000:1000 /openbao/config || true
              find /openbao/config -type d -exec chmod 0750 {} +
              find /openbao/config -type f -exec chmod 0640 {} +
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          volumeMounts:
            - name: openbao-config
              mountPath: /openbao/config-ro
              readOnly: true
            - name: openbao-config-rw
              mountPath: /openbao/config
            - name: openbao-static-seal
              mountPath: /openbao/static-seal
              readOnly: true
        - name: openbao-perms
          image: busybox:1.38.0@sha256:fd8d9aa63ba2f0982b5304e1ee8d3b90a210bc1ffb5314d980eb6962f1a9715d
          command:
            - sh
            - -c
            - |
              set -e
              mkdir -p /openbao/data
              chown -R 1000:1000 /openbao/data || true
              chmod -R 0777 /openbao/data
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          volumeMounts:
            - name: openbao-data
              mountPath: /openbao/data
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: Always
      serviceAccountName: openbao
      containers:
        - name: openbao
          image: ghcr.io/openbao/openbao:2.6.1@sha256:5b2486ab0fb90bbc788cc345b0a08616dfb375873ee8be5df3a2fd4d378a67e0
          args:
            - "server"
            - "-config=/openbao/config/openbao.hcl"
          ports:
            - containerPort: 8200
            - containerPort: 8201
          env:
            - name: BAO_ADDR
              value: "http://127.0.0.1:8200"
          # The optional bootstrap-owned Secret activates the built-in Transit
          # seal through OpenBao's documented VAULT_* environment contract.
          # Keeping it optional preserves Shamir for installations that have
          # not deliberately provisioned an independent seal service.
          envFrom:
            - secretRef:
                name: openbao-transit-seal
                optional: true
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              add:
                - IPC_LOCK
          volumeMounts:
            - name: openbao-config-rw
              mountPath: /openbao/config
            - name: openbao-data
              mountPath: /openbao/data
            - name: openbao-transit-seal-ca
              mountPath: /openbao/transit-seal
              readOnly: true
            - name: openbao-static-seal
              mountPath: /openbao/static-seal
              readOnly: true
      volumes:
        - name: openbao-config
          configMap:
            name: openbao-config
        - name: openbao-config-rw
          emptyDir: {}
        - name: openbao-transit-seal-ca
          secret:
            secretName: openbao-transit-seal-ca
            optional: true
        - name: openbao-static-seal
          secret:
            secretName: openbao-static-seal
            optional: true
            defaultMode: 0440
  volumeClaimTemplates:
    - metadata:
        name: openbao-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 10Gi
