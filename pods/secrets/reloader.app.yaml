name: reloader
project: default
annotations:
  argocd.argoproj.io/sync-wave: "-16"
source_type: helm
source_repo_url: https://stakater.github.io/stakater-charts
source_chart: reloader
source_target_revision: "2.2.14"
source_helm_values: |
  reloader:
    autoReloadAll: false
    reloadStrategy: annotations
    deployment:
      resources:
        requests:
          memory: 64Mi
          cpu: 10m
        limits:
          memory: 128Mi
    podMonitor:
      enabled: true
      labels:
        release: rancher-monitoring
destination_namespace: reloader
