apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: tailscale-operator-openbao
  namespace: tailscale
spec:
  provider: openbao
  parameters:
    roleName: tailscale-operator
    objects: |
      - objectName: client_id
        secretPath: secret/data/apps/tailscale/operator
        secretKey: client_id
      - objectName: client_secret
        secretPath: secret/data/apps/tailscale/operator
        secretKey: client_secret
