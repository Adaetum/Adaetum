---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gitea-tailnet
  namespace: gitea
  annotations:
    tailscale.com/proxy-group: adaetum-ingress
spec:
  ingressClassName: tailscale
  tls:
    - hosts: [gitea]
  defaultBackend:
    service:
      # The chart's gitea-http Service is intentionally headless. ProxyGroup
      # L7 routes need a ClusterIP to reach the healthy Gitea endpoints.
      name: gitea-tailnet-backend
      port:
        number: 3000
---
