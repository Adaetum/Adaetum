# These are additive aliases for the existing nginx .local routes. Tailscale
# owns TLS and access control, so Authentik forward-auth annotations do not
# belong on these trusted-tailnet entry points.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argocd-tailnet
  namespace: argocd
  annotations:
    tailscale.com/proxy-group: adaetum-ingress
spec:
  ingressClassName: tailscale
  tls:
    - hosts: [argocd]
  defaultBackend:
    service:
      name: argocd-server
      port:
        number: 80
---
